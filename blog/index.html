<script>window.__BLOG__ = {"site":{"name":"cccr","tagline":"把东西做慢一点，做细一点。","aboutKicker":"ABOUT","about":["这里是 cccr 的笔记，写做事的方法、工具，和写作本身。","不追热点，也不保证更新。每篇尽量只讲一件小事，讲透就停笔。","如果做法不合你的胃口，就当看一个陌生人的工作台下角。"],"social":[{"label":"GitHub","href":"https://github.com/cccr","note":"代码与半成品"},{"label":"Bilibili","href":"https://space.bilibili.com/","note":"偶尔的记录"},{"label":"邮件","href":"mailto:cccr@example.com","note":"随便聊聊"}],"rss":{"label":"RSS","note":"订阅还没接上"}},"posts":[{"slug":"slow-craft","title":"把一件小事做透","subtitle":"返工三次之后，我给自己定了一套笨办法","tags":["方法论","品质"],"date":"2026.10.18","minutes":12,"featured":true,"sections":[{"title":"从一次返工说起","html":"\n<p>上周把同一块内容返工了三次。第一次是想法没想清楚，写出来自己都不信；第二次是想法清楚了，但排版把重点埋了；第三次是重点浮出来了，结尾又软了。三次加起来，比从零做一遍还久。</p>\n<p>返工之后我把这套笨办法写在纸上：<strong class=\"marker\">先量、再改、用同一把尺子验收</strong>。这不是什么方法论文档，是给自己用的检查表。它唯一的好处是——下次不用靠感觉判断「好了没有」。</p>\n<figure class=\"post-figure fig-tall fig-tilt crop-marks\">\n  <img src=\"assets/img/milkyway.jpg\" alt=\"山谷上方的银河与星空\" loading=\"lazy\">\n  <figcaption><span class=\"fig-no\">PLATE 01</span>采集于 02:14，阳台朝南。观察对象：一个不肯睡觉的人。</figcaption>\n</figure>\n"},{"layout":"statement","text":"把一件小事做透，靠的不是灵感，是量尺。"},{"title":"先量，再改","html":"\n<p>改之前先把问题量出来。别急着「感觉不对」，感觉说不清的地方，改三次还是不对。</p>\n<div class=\"def-card\"><div class=\"def-card-label\">术语</div><div class=\"def-card-term\">量尺</div><div class=\"def-card-body\">能重复、能说出口的判断标准。一行字到边距多宽、一个段落开头有没有兑现标题，都是可以量出来的。</div></div>\n<p>我现在的量尺只有三格：这一屏的问题是什么、改哪一处、改完拿同一句话再问一遍。三格填满才动第二处。</p>\n<div class=\"process\"><div class=\"process-step\"><div class=\"process-num\">01</div><div class=\"process-content\"><div class=\"process-title\">量</div><div class=\"process-desc\">把这一屏、这一页、这一段的问题写成一句话，写不出来就是还没看清。</div></div></div><div class=\"process-step\"><div class=\"process-num\">02</div><div class=\"process-content\"><div class=\"process-title\">改</div><div class=\"process-desc\">只改这句话指向的那一处。手指忍住，别顺手美化。</div></div></div><div class=\"process-step\"><div class=\"process-num\">03</div><div class=\"process-content\"><div class=\"process-title\">再量</div><div class=\"process-desc\">拿同一句话再量一次。能量出变化才算改过，量不出就是白改。</div></div></div></div>\n<p>一次只改一处。改三处，下次出问题，你不知道是哪一处的功劳。</p>\n"},{"title":"密度不是字数","layout":"split","html":"\n<p>信息密度是有效信息除以面积，不是字数除以面积。删掉一句，读者记住的反而更多——这种情况出现得比想象中频繁。</p>\n<p>杂志页讲究「一屏一个结论」。我把它改成「一屏一个问题」：读者在这一屏需要知道什么，就只留这个答案需要的东西。剩下的，要么挪到下一页，要么删掉。</p>\n<p><strong>删掉的每一句，都该换成读者省下的一口气。</strong></p>\n<p>判断有没有做到，有个土办法：把这一屏给一个没看过前文的人，让他复述。复述得出来，密度就够了；复述成「讲了很多」，就是塞多了。</p>\n<figure class=\"post-figure fig-halftone\">\n  <img src=\"assets/img/coffee-headless.jpg\" alt=\"一个没有头的人，脸被一张报纸遮住，双手各举一只杯子\" loading=\"lazy\">\n  <figcaption><span class=\"fig-no\">PLATE 02</span>信息摄入后的标本。仍能站立，头部已被替换。</figcaption>\n</figure>\n"},{"title":"克制的三条线","html":"\n<p>做过头的东西有共同的长相：多一根线、多一个卡片、多一个看起来很专业的词。我给自己划了三条线，任何一条越线，就说明页面上多了一个抢注意力的东西。</p>\n<ul class=\"checklist\"><li>不为了填满而加东西</li><li>不为了漂亮而加线条</li><li>不为了显得专业而堆术语</li></ul>\n<div class=\"aside-card\"><div class=\"aside-icon\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/></svg></div><div class=\"aside-content\"><div class=\"aside-title\">实践提示</div><p>写完后把窗口缩到手机宽度看一遍。还立得住的排版，才是真的立得住。</p></div></div>\n<p>这三条不是审美洁癖，是成本控制。每多一个元素，下次修改就多一处要照顾，读者的眼睛也多一次要绕路。</p>\n"},{"title":"做透的验收标准","html":"\n<p>一个东西做透了，会有三个信号，都能说出口：</p>\n<ol><li>你说不出还能删什么。</li><li>陌生人看完能复述你的结论。</li><li>三个月后你自己还认得出这是你做的。</li></ol>\n<p>第三条最容易被忽略。很多活做完当下漂亮，三个月后回看，你自己都认不出那是自己的手笔——因为当时是照着别人的样式凑的。</p>\n<figure class=\"table-wrap\"><table><thead><tr><th>检查项</th><th>通过的样子</th><th>不通过的样子</th></tr></thead><tbody><tr><td>一句话结论</td><td>陌生人听完能复述</td><td>听完说「信息量挺大」</td></tr><tr><td>可删性</td><td>删任何一块都伤</td><td>删掉两块也没人发现</td></tr><tr><td>视线落点</td><td>第一眼落在标题或结论</td><td>第一眼落在装饰上</td></tr><tr><td>耗时</td><td>花的时间和开始估的差不多</td><td>时间全花在边角细节上</td></tr></tbody></table></figure>\n<p>这四行我贴在显示器边上。做完了对着过一遍，过的就打勾，不客气。</p>\n<figure class=\"post-figure fig-specimen fig-offset\">\n  <img src=\"assets/img/leaf-specimen.jpg\" alt=\"一片带小洞的黄色枫叶挂在枝头\" loading=\"lazy\">\n  <figcaption><span class=\"fig-no\">PLATE 03</span>单片。深秋采于路边，叶心有一个洞。</figcaption>\n</figure>\n"},{"title":"一张表，一段代码，一次复盘","html":"\n<p>这套办法落到工具上，最开始只是一个 Markdown 文件。每天睡前写三行：</p>\n<pre><code class=\"language-md\">- 今天的结论：\n- 明天只改那一处：\n- 量了没有：</code></pre>\n<p>看起来过于轻。用了六周之后，我在第三行后面加了一个数字：这周返工了几次。数字在往下掉，看着当然舒服，但它真正的用处不是好看，是让「感觉好点了」变成「确实好点了」。</p>\n<figure class=\"hchart\"><div class=\"hc-title\">最近六周返工次数</div><div class=\"hc-body\"><div class=\"hc-row\"><div class=\"hc-label\">第 1 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:100.00%\"></span><span class=\"hc-val\">6<span class=\"hf-sp\"> </span>次</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 2 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:66.67%\"></span><span class=\"hc-val\">4<span class=\"hf-sp\"> </span>次</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 3 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:83.33%\"></span><span class=\"hc-val\">5<span class=\"hf-sp\"> </span>次</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 4 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:50.00%\"></span><span class=\"hc-val\">3<span class=\"hf-sp\"> </span>次</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 5 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:33.33%\"></span><span class=\"hc-val\">2<span class=\"hf-sp\"> </span>次</span></div></div></div><div class=\"hc-row hc-hi\"><div class=\"hc-label\">第 6 周</div><div class=\"hc-bars\"><div class=\"hc-bar hc-hi\"><span class=\"hc-fill\" style=\"width:16.67%\"></span><span class=\"hc-val\">1<span class=\"hf-sp\"> </span>次</span></div></div></div></div></figure>\n<p>数字不是目的。目的是让注意力每天都落回同一件事上——量尺上那三格。</p>\n"},{"layout":"data","label":"六周下来","items":[{"num":"3","unit":"次","cap":"同一块内容返工的次数"},{"num":"6","unit":"周","cap":"把返工次数记下来的时长"},{"num":"1","unit":"次","cap":"最近一周的返工次数"}],"note":"数字不会替我改稿。它只负责让「感觉好点了」变成「确实好点了」。"},{"layout":"panel","text":"看得见的规矩，才管得住手。","note":"贴在显示器边上的那张纸"},{"title":"尾声","html":"\n<figure class=\"post-figure fig-band crop-marks fig-halftone\">\n  <img src=\"assets/img/ridge-light.jpg\" alt=\"山脊最后一段被夕阳照亮，其余部分沉在阴影里\" loading=\"lazy\">\n  <figcaption><span class=\"fig-no\">PLATE 04</span>山脊东侧，日落前四分钟。光只占全部的七分之一。</figcaption>\n</figure>\n<p>这套办法没什么新鲜的。量、改、验收，全是常识。</p>\n<p>难的是每次都按常识做事。返工常常不是因为不会，是因为跳过了。跳过一次没出事，就有了第二次，然后一年的时间都花在补第三次的窟窿上<sup class=\"fn-ref\"><a href=\"#fn-craft-1\" id=\"fnref-craft-1\">1</a></sup>。</p>\n<p>所以我把检查表贴在显示器边上，而不是存在某个 App 里。App 会提醒我更新，纸不会。</p>\n<ol class=\"footnotes\"><li id=\"fn-craft-1\">「量尺」这个词借自我一个做出版的朋友。他说校对就是用同一把尺子量三遍，量到第三遍还好意思交，就算过了。 <a class=\"fn-back\" href=\"#fnref-craft-1\" aria-label=\"返回正文\">↩</a></li></ol>\n"}]},{"slug":"tools-slow-me","title":"工具不该比活儿更花时间","subtitle":"一条判断线，替我砍掉了大半工具","tags":["工具","方法论"],"date":"2026.09.27","minutes":8,"sections":[{"title":"一个下午的折腾","html":"\n<p>花了一下午配置一个「更好用」的写作工具。笔记迁移、插件、快捷键、主题、字体。配置完天黑了，晚上要写的东西只写了三行。</p>\n<p>第二天早上我盯着那三行想：这个下午不是花在写作上，是花在一个「让我写得更快」的东西上。而它甚至还没开始省时间。</p>\n"},{"layout":"statement","text":"工具是用来省时间的，不是用来花的。"},{"title":"一条判断线","html":"\n<p>现在我用一条线判断工具值不值得：<span class=\"marker\">它一周能省的分钟数，要稳定大于它花掉的分钟数</span>。一周之内回不了本的，基本就不装了。</p>\n<div class=\"def-card\"><div class=\"def-card-label\">判断线</div><div class=\"def-card-term\">回本线</div><div class=\"def-card-body\">一个工具从安装到顺手，允许花掉的分钟数，不超过它一周能省下的分钟数。超了就是负债，不是资产。</div></div>\n<p>这条线砍掉了很多「以后可能会用」的东西：稍后读、双链笔记、自动化流水线、第三个待办 App。它们单个都不贵，加起来是一整块注意力。</p>\n"},{"title":"现在留在桌上的东西","html":"\n<p>三个，缺一不可：</p>\n<ul><li>一个纯文本编辑器，能开目录就够了；</li><li>一个 Markdown 文件，什么都往里扔，不分类；</li><li>一个计时器，四十分钟响一次。</li></ul>\n<p>后两个其实不是工具，是约束。约束比工具管用——工具给你更多可能，约束帮你砍掉选择。</p>\n<div class=\"aside-card\"><div class=\"aside-icon\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/></svg></div><div class=\"aside-content\"><div class=\"aside-title\">实践提示</div><p>想装新东西之前，先问：现在这个工具，我用到它的几成？八成以下的，从来不是缺工具。</p></div></div>\n"},{"layout":"panel","text":"工具越少，习惯越稳。","note":""},{"title":"结尾","html":"\n<p>习惯稳了，工具好坏就变得不重要了。</p>\n<p>这话听起来像在劝人清心寡欲。其实反过来也一样成立：工具越好，用不上它的人越焦虑。我属于后者，所以选择先少装。</p>\n"}]},{"slug":"write-to-think","title":"写下来才算想过","subtitle":"笔记不是收藏，是压缩","tags":["写作"],"date":"2026.09.09","minutes":7,"sections":[{"title":"收藏是假的","html":"\n<p>我的收藏夹里有四百多篇文章，点开过的不到三成。收藏那个动作给人的满足感，几乎和读完一样——甚至更便宜。</p>\n<p>更麻烦的是，收藏让人误以为自己「拥有」了这个观点。真正需要用的时候，一个都调不出来。</p>\n"},{"layout":"statement","text":"收藏是把别人的结论存进硬盘，写作是把结论装进自己脑子。"},{"title":"写下来的三个作用","html":"\n<div class=\"process\"><div class=\"process-step\"><div class=\"process-num\">01</div><div class=\"process-content\"><div class=\"process-title\">逼出结论</div><div class=\"process-desc\">写不出结论，说明还没想清楚。这是写作最诚实的地方。</div></div></div><div class=\"process-step\"><div class=\"process-num\">02</div><div class=\"process-content\"><div class=\"process-title\">造出索引</div><div class=\"process-desc\">一个月后能搜到自己当时怎么想的，比记住更重要。</div></div></div><div class=\"process-step\"><div class=\"process-num\">03</div><div class=\"process-content\"><div class=\"process-title\">留下证据</div><div class=\"process-desc\">判断到底对不对，翻旧账就知道，不用靠记忆美化自己。</div></div></div></div>\n<p>三个作用里，第一个最值钱。很多时候我以为自己想通了，一落笔发现中间缺了一环。</p>\n"},{"title":"我的记法","html":"\n<p>一条笔记只写三行：结论、依据、下一步。超过三行，多半是在偷偷写文章，那就该开一个新的文档。</p>\n<pre><code class=\"language-md\">结论：排版密度靠删，不靠加。\n依据：三次返工里两次是塞多了。\n下一步：下次先写完再删一轮。</code></pre>\n<p>如果是别人的观点，我只记「我不认同哪一点」。记他讲了什么没有用，那种笔记永远不会被翻第二次。</p>\n<div class=\"aside-card\"><div class=\"aside-icon\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/></svg></div><div class=\"aside-content\"><div class=\"aside-title\">实践提示</div><p>笔记的开头别写「关于……的思考」。直接写那个结论，读的时候才有抓手，三个月后搜也搜得到。</p></div></div>\n"},{"layout":"panel","text":"写作不是想清楚之后的事，是想清楚的方式。","note":""},{"title":"结尾","html":"\n<p>所以我现在订了一个很笨的规矩：想不清的事，别在脑子里绕，开个空白文件写三行。写完往往就知道该干嘛了——或者知道这件事暂时不该干嘛。</p>\n"}]},{"slug":"three-things","title":"一周只认真做三件事","subtitle":"把精力当预算，而不是当弹药","tags":["节奏"],"date":"2026.08.21","minutes":5,"sections":[{"title":"从「全力」到「配额」","html":"\n<p>以前的任务表是一长串，每天打勾。打到周三，勾已经没意义了——剩下的和没剩下的都看不见。</p>\n<p>后来改成一周只排三件「必须认真做」的事。剩下的时间留给杂事和意外。第一个月，完成的事反而变多了。</p>\n"},{"layout":"statement","text":"精力是预算，先决定花在哪三处，剩下的自然有去处。"},{"title":"怎么选三件","html":"\n<p>每周一早上问自己三个问题，答案交叉的那三件就是这一周的三件：</p>\n<ol><li>这周结束时，什么没做完我会难受？</li><li>哪件事做完，别的会变简单？</li><li>哪件事不做，其实没人会死？</li></ol>\n<p>第三个问题专门用来删东西。想删又不敢删的，就会一直占着位置。</p>\n<ul class=\"checklist\"><li>三件之内，不排第四件</li><li>做不完就减，不加</li><li>每天只问「今天动的是哪件」，不问「还剩几件」</li></ul>\n"},{"layout":"data","label":"五周之后","items":[{"num":"3","unit":"件","cap":"每周固定只排三件"},{"num":"5","unit":"周","cap":"连续这样排的周数"},{"num":"11","unit":"件","cap":"五周里真正做完的事"}],"note":"数字不漂亮，但它把「忙」和「做完」这两件事分开了。"},{"title":"五周之后","html":"\n<p>数字不漂亮，但方向是对的：</p>\n<figure class=\"hchart\"><div class=\"hc-title\">每周三件事的完成数量</div><div class=\"hc-body\"><div class=\"hc-row\"><div class=\"hc-label\">第 1 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:33.33%\"></span><span class=\"hc-val\">1<span class=\"hf-sp\"> </span>件</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 2 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:66.67%\"></span><span class=\"hc-val\">2<span class=\"hf-sp\"> </span>件</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 3 周</div><div class=\"hc-bars\"><div class=\"hc-bar hc-hi\"><span class=\"hc-fill\" style=\"width:100.00%\"></span><span class=\"hc-val\">3<span class=\"hf-sp\"> </span>件</span></div></div></div><div class=\"hc-row\"><div class=\"hc-label\">第 4 周</div><div class=\"hc-bars\"><div class=\"hc-bar \"><span class=\"hc-fill\" style=\"width:66.67%\"></span><span class=\"hc-val\">2<span class=\"hf-sp\"> </span>件</span></div></div></div><div class=\"hc-row hc-hi\"><div class=\"hc-label\">第 5 周</div><div class=\"hc-bars\"><div class=\"hc-bar hc-hi\"><span class=\"hc-fill\" style=\"width:100.00%\"></span><span class=\"hc-val\">3<span class=\"hf-sp\"> </span>件</span></div></div></div></div></figure>\n<p>没完成的那两周不是因为忙，是因为那三件排得太大。三件不是三次冲刺，是三块可以在一周内做透的事。</p>\n<p>反过来看，被删掉的第四件、第五件，事后回想，一件都不重要。</p>\n"}]},{"slug":"stop-chasing","title":"我为什么不再追新","subtitle":"信息节食一个月之后","tags":["决策"],"date":"2026.08.02","minutes":4,"sections":[{"title":"追新追的是什么","html":"\n<p>早上刷到三个「新范式」，晚上一个都记不住。追新的快感来自「我在场」，不是「我懂」。</p>\n<p>在场感很便宜，点开就有；懂要花力气，还得承认自己之前做错了。所以大部分人（包括我）更喜欢前者。</p>\n<figure class=\"post-figure fig-tall fig-tilt fig-offset\">\n  <img src=\"assets/img/pumpkin.jpg\" alt=\"一颗咧嘴大笑的南瓜灯插画，印在粗糙的灰纸上\" loading=\"lazy\">\n  <figcaption><span class=\"fig-no\">PLATE 05</span>万圣节遗留物。过季两个月，还在笑。</figcaption>\n</figure>\n"},{"layout":"statement","text":"信息越便宜，动手越贵。"},{"title":"一个月的试验","html":"\n<p>断掉所有信息源一个月，只保留两份定期看的东西：一个我信得过的作者，一个我所在领域的更新。</p>\n<p>结果没漏掉任何重要的事。真正重要的消息有两种走法：要么热闹到我绕不开，要么直接关系到我在做的事——后一种，会有同行来告诉我。</p>\n"},{"title":"结尾","html":"\n<p><span class=\"marker\">手比眼睛好用</span>。看得越多，动手越少，判断力也会跟着钝——因为判断没被现实打过脸。</p>\n<p>现在我的默认动作是：先写今天那一行，写完再看要不要刷。顺序反过来之后，一天就安静了。</p>\n"}]}]};</script>
<script>/* =====================================================================
   cccr 博客 · 前端逻辑
   无构建依赖，纯原生 JS：hash 路由 + 视图渲染 + 搜索筛选 + 目录 + 阅读设置。
   ===================================================================== */
(function () {
  'use strict';

  var DATA = window.__BLOG__ || { site: {}, posts: [] };
  var SITE = DATA.site || {};
  var POSTS = DATA.posts || [];
  var bySlug = new Map(POSTS.map(function (p) { return [p.slug, p]; }));

  var $ = function (sel, el) { return (el || document).querySelector(sel); };
  var $$ = function (sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var stripTags = function (s) { return String(s).replace(/<[^>]*>/g, ' '); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var readTime = function (p) { return '约 ' + p.minutes + ' 分钟'; };

  /* ---------- 搜索索引（标题 / 副标题 / 标签 / 正文纯文本） ---------- */
  POSTS.forEach(function (p) {
    p._hay = [
      p.title,
      p.subtitle,
      (p.tags || []).join(' '),
      (p.sections || []).map(function (s) { return s.title + ' ' + stripTags(s.html); }).join(' ')
    ].join(' ').toLowerCase();
  });

  /* ---------- DOM ---------- */
  var main = $('#main');
  var readbar = $('#readbar');
  var readbarFill = $('#readbar-fill');
  var tocNav = $('#toc');
  var tocItemsWrap = $('#toc-items');
  var tocToggle = $('#toc-toggle');
  var tocScrim = $('#toc-scrim');
  var navLinks = $$('.site-nav a');
  var root = document.documentElement;

  var state = { view: 'post', post: null, query: '', tag: '全部' };
  var tocOpen = false;
  var spy = null;

  /* =====================================================================
     TOC
     ===================================================================== */
  function setTocOpen(v) {
    tocOpen = v;
    tocNav.classList.toggle('toc-open', v);
    root.classList.toggle('toc-is-open', v);
    tocToggle.setAttribute('aria-expanded', String(v));
  }

  function buildToc(post) {
    tocItemsWrap.innerHTML = (post.sections || [])
      .filter(function (s) { return !!s.title; })
      .map(function (s, i) {
        return '<a class="toc-item" href="#sec-' + (i + 1) + '" data-target="sec-' + (i + 1) + '">' +
          '<span class="toc-num">' + pad(i + 1) + '</span>' + esc(s.title) + '</a>';
      }).join('');
  }

  function startSpy() {
    if (spy) { spy.disconnect(); spy = null; }
    var secs = $$('.section[id]');
    if (!secs.length || !('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        $$('.toc-item').forEach(function (a) { a.classList.remove('toc-active'); });
        var link = $('.toc-item[data-target="' + en.target.id + '"]');
        if (link) link.classList.add('toc-active');
      });
    }, { rootMargin: '-16% 0px -66% 0px' });
    secs.forEach(function (s) { spy.observe(s); });
  }

  /* 视觉块滚进视口时轻轻浮上来（正文节不加，避免拖沓） */
  var revealer = null;
  function startReveal() {
    if (revealer) { revealer.disconnect(); revealer = null; }
    var els = $$('.reveal');
    if (!els.length) return;
    if (!('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('is-in'); });
      return;
    }
    revealer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add('is-in');
        revealer.unobserve(en.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    els.forEach(function (el) { revealer.observe(el); });
  }

  tocToggle.addEventListener('click', function (e) { e.stopPropagation(); setTocOpen(!tocOpen); });
  tocScrim.addEventListener('click', function () { setTocOpen(false); });
  tocItemsWrap.addEventListener('click', function (e) {
    var a = e.target.closest('.toc-item');
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute('data-target'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (window.matchMedia('(max-width: 1024px)').matches) setTocOpen(false);
  });

  /* =====================================================================
     视图：文章
     ===================================================================== */
  function sectionNumber(n) {
    return '<div class="section-number sn-sym">' +
      '<span class="sn-side sn-l"><span class="sn-star s3">✦</span><span class="sn-star s2">✦</span><span class="sn-star s1">✦</span></span>' +
      '<span class="sn-num">' + n + '</span>' +
      '<span class="sn-side sn-r"><span class="sn-star s1">✦</span><span class="sn-star s2">✦</span><span class="sn-star s3">✦</span></span>' +
      '</div>';
  }

  function postNavHtml(idx) {
    var prev = POSTS[idx - 1] || null;   // 更新的文章
    var next = POSTS[idx + 1] || null;   // 更早的文章
    var parts = [];
    if (prev) {
      parts.push('<a class="pn-prev" href="#/a/' + prev.slug + '">' +
        '<span class="pn-label">← 更新的一篇</span>' +
        '<span class="pn-title">' + esc(prev.title) + '</span></a>');
    }
    if (next) {
      parts.push('<a class="pn-next" href="#/a/' + next.slug + '">' +
        '<span class="pn-label">更早的一篇 →</span>' +
        '<span class="pn-title">' + esc(next.title) + '</span></a>');
    }
    if (!parts.length) return '';
    // 只有一侧时让它靠左/靠右对齐，不塞空占位
    var cls = parts.length === 1 ? (prev ? ' single-prev' : ' single-next') : '';
    return '<nav class="post-nav' + cls + '" aria-label="文章导航">' + parts.join('') + '</nav>';
  }

  function renderChapter(s, no) {
    var isSplit = s.layout === 'split';
    return '<section class="section' + (isSplit ? ' sec-split' : '') + '" id="sec-' + no + '">' +
      sectionNumber(pad(no)) +
      (isSplit
        ? '<div class="split-row"><h2 class="split-title">' + esc(s.title) + '</h2>' +
          '<div class="split-body">' + s.html + '</div></div>'
        : '<h2>' + esc(s.title) + '</h2>' + s.html) +
      '</section>';
  }

  /* 视觉块：不占章节编号、不进目录，只负责给阅读节奏换气 */
  function renderBlock(s) {
    if (s.layout === 'statement') {
      return '<section class="section sec-statement reveal">' +
        '<div class="stmt-wrap"><p class="stmt-line">' + esc(s.text) + '</p></div>' +
        '</section>';
    }
    if (s.layout === 'panel') {
      return '<section class="section sec-panel reveal">' +
        '<div class="panel-block"><p class="panel-line">' + esc(s.text) + '</p>' +
        (s.note ? '<span class="panel-note">' + esc(s.note) + '</span>' : '') +
        '</div></section>';
    }
    if (s.layout === 'data') {
      var cells = (s.items || []).map(function (it) {
        return '<div class="data-cell">' +
          '<span class="data-num">' + esc(it.num) +
            (it.unit ? '<span class="data-unit">' + esc(it.unit) + '</span>' : '') +
          '</span>' +
          '<span class="data-cap">' + esc(it.cap) + '</span>' +
        '</div>';
      }).join('');
      return '<section class="section sec-data reveal">' +
        (s.label ? '<div class="data-label">' + esc(s.label) + '</div>' : '') +
        '<div class="data-row">' + cells + '</div>' +
        (s.note ? '<p class="data-note">' + esc(s.note) + '</p>' : '') +
        '</section>';
    }
    return '';
  }

  function renderPost(post) {
    var idx = POSTS.indexOf(post);
    var tags = (post.tags || []).map(function (t) { return '<span class="dl-tag">' + esc(t) + '</span>'; })
      .join('<span class="dl-sep">·</span>');

    var chapterNo = 0;
    var secs = (post.sections || []).map(function (s) {
      if (s.title) { chapterNo++; return renderChapter(s, chapterNo); }
      return renderBlock(s);
    }).join('\n');

    main.innerHTML =
      '<article class="view view-post">' +
        '<div class="post-wrap">' +
          '<div class="post-specimen"><span class="tag-glitch">SPECIMEN No.' + pad(idx + 1) + '</span></div>' +
          '<div class="doc-chrome doc-line">' +
            tags +
            '<span class="dl-sep">·</span><span>' + esc(SITE.name || 'cccr') + '</span>' +
            '<span class="dl-sep">·</span><span>' + esc(post.date) + '</span>' +
            '<span class="dl-sep">·</span><span>' + readTime(post) + '</span>' +
          '</div>' +
          '<header class="hero">' +
            '<h1 class="ink-offset ink-offset--ink" data-text="' + esc(post.title) + '">' + esc(post.title) + '</h1>' +
            '<p class="hero-subtitle">' + esc(post.subtitle) + '</p>' +
            '<span class="vert-tag post-vert">' + esc((post.tags || []).join(' / ')) + ' · ' + esc(post.date) + '</span>' +
          '</header>' +
          secs +
          '<div class="divider-dot">· · ·</div>' +
          postNavHtml(idx) +
        '</div>' +
      '</article>';

    tocNav.hidden = false;
    setTocOpen(false);
    buildToc(post);
  }

  /* =====================================================================
     视图：列表（搜索 + 标签筛选）
     ===================================================================== */
  function allTags() {
    var seen = [];
    POSTS.forEach(function (p) {
      (p.tags || []).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); });
    });
    return seen;
  }

  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
      return safe.replace(new RegExp(needle, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
    } catch (e) { return safe; }
  }

  function renderRows() {
    var q = state.query.trim();
    var ql = q.toLowerCase();
    var list = POSTS.filter(function (p) {
      if (state.tag !== '全部' && (p.tags || []).indexOf(state.tag) < 0) return false;
      if (ql && p._hay.indexOf(ql) < 0) return false;
      return true;
    });

    $('#post-list').innerHTML = list.map(function (p) {
      var i = POSTS.indexOf(p);
      return '<li class="post-row"><a href="#/a/' + p.slug + '">' +
        '<span class="pr-num">' + pad(i + 1) + '</span>' +
        '<span class="pr-main">' +
          '<span class="pr-title">' + highlight(p.title, q) + '</span>' +
          '<span class="pr-sub">' + highlight(p.subtitle, q) + '</span>' +
        '</span>' +
        '<span class="pr-meta">' +
          '<span class="pr-tags">' + (p.tags || []).map(esc).join(' / ') + '</span>' +
          '<span>' + esc(p.date) + '</span>' +
        '</span>' +
        '<span class="pr-arrow" aria-hidden="true">→</span>' +
      '</a></li>';
    }).join('');

    $('#lc-live').textContent = '共 ' + list.length + ' 篇';
    $('#list-empty').hidden = list.length > 0;

    // 标签计数
    $$('#chips .chip').forEach(function (b) {
      var t = b.getAttribute('data-tag');
      var n = t === '全部' ? POSTS.length
        : POSTS.filter(function (p) { return (p.tags || []).indexOf(t) >= 0; }).length;
      var cnt = $('.chip-n', b);
      if (cnt) cnt.textContent = n;
    });
  }

  function updateChips() {
    $$('#chips .chip').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tag') === state.tag);
    });
  }

  function renderList() {
    tocNav.hidden = true;
    setTocOpen(false);

    var tags = ['全部'].concat(allTags());
    var kicker = 'INDEX · 全部文章';
    var sub = POSTS.length + ' 篇随笔，关于做事、工具和写作。慢慢看，不用着急。';

    main.innerHTML =
      '<div class="view view-list">' +
        '<header class="list-head">' +
          '<div class="list-kicker">' + kicker + '</div>' +
          '<h1 class="list-title ink-offset ink-offset--ink" data-text="文章">文章</h1>' +
          '<p class="list-sub">' + esc(sub) + '</p>' +
        '</header>' +
        '<div class="list-tools">' +
          '<div class="search-wrap">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">' +
              '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3"/></svg>' +
            '<input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索标题、标签或正文…" value="' + esc(state.query) + '" aria-label="搜索文章">' +
            '<button class="search-clear" id="q-clear" type="button" aria-label="清空搜索"' + (state.query ? '' : ' hidden') + '>×</button>' +
          '</div>' +
          '<div class="tag-chips" id="chips" role="group" aria-label="按标签筛选">' +
            tags.map(function (t) {
              return '<button type="button" class="chip' + (t === state.tag ? ' on' : '') + '" data-tag="' + esc(t) + '">' +
                esc(t) + '<span class="chip-n"></span></button>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="list-count"><span id="lc-live">共 ' + POSTS.length + ' 篇</span><span>按写作时间排序</span></div>' +
        '<ul class="post-list" id="post-list"></ul>' +
        '<div class="list-empty" id="list-empty" hidden><span class="le-k">NO MATCH</span>没有匹配的文章，换个词试试。</div>' +
      '</div>';

    renderRows();

    var q = $('#q');
    q.addEventListener('input', function () {
      state.query = q.value;
      $('#q-clear').hidden = !q.value;
      renderRows();
    });
    $('#q-clear').addEventListener('click', function () {
      state.query = '';
      q.value = '';
      $('#q-clear').hidden = true;
      renderRows();
      q.focus();
    });
    $('#chips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      state.tag = b.getAttribute('data-tag');
      updateChips();
      renderRows();
    });
  }

  /* =====================================================================
     视图：首页（封面）
     ===================================================================== */
  function renderHome() {
    tocNav.hidden = true;
    setTocOpen(false);

    var latest = POSTS[0];
    var picks = POSTS.slice(1, 4);
    var issue = 'ISSUE ' + pad(new Date().getMonth() + 1);

    var latestBlock = latest
      ? '<div class="home-latest">' +
          '<div class="latest-kicker"><span class="lk-dot"></span>最新一篇</div>' +
          '<a class="latest-card" href="#/a/' + latest.slug + '">' +
            '<h2 class="latest-title">' + esc(latest.title) + '</h2>' +
            '<p class="latest-sub">' + esc(latest.subtitle) + '</p>' +
            '<div class="latest-meta">' +
              '<span>' + (latest.tags || []).map(esc).join(' · ') + '</span>' +
              '<span>' + esc(latest.date) + '</span>' +
              '<span>' + readTime(latest) + '</span>' +
            '</div>' +
            '<span class="latest-cta">阅读全文 <i>→</i></span>' +
          '</a>' +
        '</div>'
      : '';

    var pickCards = picks.map(function (p, i) {
      return '<a class="pick-card" href="#/a/' + p.slug + '">' +
        '<span class="pick-no">' + pad(i + 2) + '</span>' +
        '<span class="pick-title">' + esc(p.title) + '</span>' +
        '<span class="pick-sub">' + esc(p.subtitle) + '</span>' +
        '<span class="pick-meta">' + (p.tags || []).map(esc).join(' · ') + ' · ' + esc(p.date) + '</span>' +
        '</a>';
    }).join('');

    main.innerHTML =
      '<div class="view view-home">' +
        '<header class="home-hero">' +
          '<div class="home-hero-media">' +
            '<img src="assets/img/hero-dolphins.jpg" ' +
              'alt="两只穿芭蕾舞裙的海豚在海面上直立，其中一只戴着礼帽、拿着手杖" ' +
              'fetchpriority="high">' +
            '<div class="home-hero-shade"></div>' +
            '<span class="vert-tag" style="top:20px;right:18px;color:rgba(244,245,247,.55)">' +
              'SPECIMEN SET · VOL. 01 · 五件藏品' +
            '</span>' +
          '</div>' +
          '<div class="home-hero-body">' +
            '<div class="home-hero-main">' +
              '<div class="home-hero-tags">' +
                '<span class="tag-glitch">' + issue + '</span>' +
                '<span class="home-kicker">标本馆 · 观察记录</span>' +
              '</div>' +
              '<h1 class="home-title ink-offset" data-text="' + esc(SITE.name) + '">' + esc(SITE.name) + '</h1>' +
              '<p class="home-tagline">' + esc(SITE.tagline || '') + '</p>' +
            '</div>' +
            '<div class="home-hero-side">' +
              '<div class="hs-item"><span class="hs-k">篇目</span><span class="hs-v">' + POSTS.length + '</span></div>' +
              '<div class="hs-item"><span class="hs-k">更新</span><span class="hs-v">' + (latest ? esc(latest.date) : '—') + '</span></div>' +
              '<div class="hs-item"><span class="hs-k">读法</span><span class="hs-v">随便挑一篇</span></div>' +
            '</div>' +
          '</div>' +
        '</header>' +
        '<div class="home-body">' +
          latestBlock +
          (picks.length
            ? '<section class="home-picks">' +
                '<div class="picks-head"><span class="picks-kicker">也看看这些</span>' +
                  '<a class="picks-all" href="#/articles">全部文章 →</a></div>' +
                '<div class="pick-grid">' + pickCards + '</div>' +
              '</section>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* =====================================================================
     视图：关于
     ===================================================================== */
  function renderAbout() {
    tocNav.hidden = true;
    setTocOpen(false);

    var social = (SITE.social || []).map(function (s) {
      var external = /^https?:/i.test(s.href || '');
      return '<a class="social-row" href="' + esc(s.href || '#') + '"' +
        (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
        '<span class="social-label">' + esc(s.label) + '</span>' +
        '<span class="social-note">' + esc(s.note || '') + '</span></a>';
    }).join('');

    main.innerHTML =
      '<div class="view view-about">' +
        '<header class="about-head">' +
          '<div class="list-kicker">ABOUT · 关于</div>' +
          '<h1 class="about-title ink-offset ink-offset--ink" data-text="' + esc(SITE.name || 'cccr') + '">' +
            esc(SITE.name || 'cccr') + '</h1>' +
        '</header>' +
        '<div class="about-body">' +
          (SITE.about || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</div>' +
        '<figure class="post-figure fig-band about-figure fig-halftone crop-marks">' +
          '<img src="assets/img/forest-lake.jpg" alt="秋日白桦林与湖面倒影" loading="lazy">' +
          '<figcaption><span class="fig-no">PLATE A</span>住所西北 1.2 公里。水面很静，像没人来过。</figcaption>' +
        '</figure>' +
        '<hr class="about-rule">' +
        '<div class="social-grid">' + social + '</div>' +
        '<div class="rss-row"><span class="rss-chip">' + esc((SITE.rss || {}).label || 'RSS') + '</span>' +
          '<span>' + esc((SITE.rss || {}).note || '订阅还没接上') + '</span></div>' +
        '<div class="about-foot"><span>建站 2026</span><span>共 ' + POSTS.length + ' 篇</span></div>' +
      '</div>';
  }

  /* =====================================================================
     路由
     ===================================================================== */
  function route() {
    var raw = location.hash.replace(/^#\/?/, '');
    var seg = raw.split('/').filter(Boolean);
    if (!seg.length || seg[0] === 'home') return { name: 'home' };
    if (seg[0] === 'articles') return { name: 'list' };
    if (seg[0] === 'about') return { name: 'about' };
    if (seg[0] === 'a' && seg[1] && bySlug.has(seg[1])) return { name: 'post', post: bySlug.get(seg[1]) };
    return { name: 'home' };
  }

  function updateReadbar() {
    var isPost = route().name === 'post' && !!state.post;
    readbar.style.display = isPost ? 'block' : 'none';
    if (!isPost) { readbarFill.style.width = '0%'; return; }
    var max = root.scrollHeight - root.clientHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, root.scrollTop / max)) : 0;
    readbarFill.style.width = (p * 100).toFixed(2) + '%';
  }

  function render() {
    var r = route();
    state.post = r.post || null;
    if (spy) { spy.disconnect(); spy = null; }

    window.scrollTo({ top: 0, behavior: 'auto' });
    root.classList.remove('is-scrolling');

    if (r.name === 'list') {
      renderList();
      document.title = '文章 · ' + (SITE.name || 'cccr');
    } else if (r.name === 'about') {
      renderAbout();
      document.title = '关于 · ' + (SITE.name || 'cccr');
    } else if (r.name === 'home') {
      renderHome();
      document.title = (SITE.name || 'cccr') + ' · 笔记';
    } else if (r.post) {
      renderPost(r.post);
      document.title = r.post.title + ' · ' + (SITE.name || 'cccr');
    } else {
      main.innerHTML = '<div class="view view-list"><div class="list-empty">还没有文章。</div></div>';
      document.title = SITE.name || 'cccr';
    }

    var activeNav = r.name === 'about' ? 'about' : (r.name === 'home' ? '' : 'articles');
    navLinks.forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-nav') === activeNav); });

    updateReadbar();
    requestAnimationFrame(function () { startSpy(); startReveal(); });
  }

  /* ---------- 顶栏搜索 ---------- */
  $('#search-jump').addEventListener('click', function () {
    if (route().name === 'list') {
      var qi = $('#q');
      if (qi) qi.focus();
      return;
    }
    location.hash = '#/articles';
    setTimeout(function () { var qi2 = $('#q'); if (qi2) qi2.focus(); }, 80);
  });

  /* =====================================================================
     阅读设置：配色 / 明暗 / 字号 / 字体
     ===================================================================== */
  var PREF_KEY = 'cccr-blog-prefs-v2';
  var fabToggle = $('#hf-settings-toggle');
  var fabDropdown = $('#hf-settings-dropdown');
  var readOptions = { s: '0.99', m: '1.0625', l: '1.16', xl: '1.27' };

  function savePrefs() {
    try {
      var fontOpt = $('.hf-font-option.active');
      localStorage.setItem(PREF_KEY, JSON.stringify({
        theme: root.dataset.theme,
        read: root.dataset.read,
        font: fontOpt ? fontOpt.getAttribute('data-family') : ''
      }));
    } catch (e) { /* 隐私模式下不保存，不影响阅读 */ }
  }

  function setTheme(id, scheme) {
    root.dataset.theme = id;
    root.dataset.scheme = scheme || 'light';
    root.style.colorScheme = root.dataset.scheme;
    $$('.hf-swatch').forEach(function (s) {
      s.classList.toggle('active', s.getAttribute('data-theme-id') === id);
    });
    var isNight = id === 'midnight-ink';
    $$('#scheme-row .hf-size-btn').forEach(function (b) {
      b.classList.toggle('on', (b.getAttribute('data-scheme-mode') === 'night') === isNight);
    });
    savePrefs();
  }

  function setRead(v) {
    if (!readOptions[v]) v = 'm';
    root.dataset.read = v;
    $$('#size-row .hf-size-btn').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-read') === v);
    });
    savePrefs();
  }

  function setFont(opt) {
    $$('.hf-font-option').forEach(function (o) { o.classList.toggle('active', o === opt); });
    (opt.getAttribute('data-vars') || '--font-sans').split(' ').forEach(function (v) {
      root.style.setProperty(v, opt.getAttribute('data-family'));
    });
    var href = opt.getAttribute('data-href');
    if (href && !document.querySelector('link[data-hf-font="' + href + '"]')) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.dataset.hfFont = href;
      link.href = href;
      document.head.appendChild(link);
    }
    savePrefs();
  }

  function closeDropdown() {
    fabDropdown.classList.remove('open');
    fabToggle.setAttribute('aria-expanded', 'false');
  }

  fabToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var willOpen = !fabDropdown.classList.contains('open');
    fabDropdown.classList.toggle('open', willOpen);
    fabToggle.setAttribute('aria-expanded', String(willOpen));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.hf-dropdown') && !e.target.closest('.hf-fab-btn')) closeDropdown();
  });

  $$('.hf-swatch').forEach(function (sw) {
    sw.addEventListener('click', function (e) {
      e.stopPropagation();
      setTheme(sw.getAttribute('data-theme-id'), sw.getAttribute('data-scheme'));
    });
  });

  $$('#scheme-row .hf-size-btn').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (b.getAttribute('data-scheme-mode') === 'night') setTheme('midnight-ink', 'dark');
      else setTheme('indigo-porcelain', 'light');
    });
  });

  $$('#size-row .hf-size-btn').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      setRead(b.getAttribute('data-read'));
    });
  });

  $$('.hf-font-option').forEach(function (opt) {
    opt.addEventListener('click', function (e) { e.stopPropagation(); setFont(opt); });
  });

  function restorePrefs() {
    try {
      var p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
      if (!p) return;
      if (p.theme) setTheme(p.theme, p.theme === 'midnight-ink' ? 'dark' : 'light');
      if (p.read) setRead(p.read);
      if (p.font) {
        var opt = $$('.hf-font-option').filter(function (o) { return o.getAttribute('data-family') === p.font; })[0];
        if (opt) setFont(opt);
      }
    } catch (e) { /* 忽略损坏的偏好记录 */ }
  }

  /* ---------- 全局键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (tocOpen) setTocOpen(false);
      closeDropdown();
    }
  });

  /* ---------- 滚动 / 尺寸 ---------- */
  var scrollIdle = null;
  function markScrolling() {
    root.classList.add('is-scrolling');
    clearTimeout(scrollIdle);
    scrollIdle = setTimeout(function () { root.classList.remove('is-scrolling'); }, 280);
  }
  window.addEventListener('scroll', updateReadbar, { passive: true });
  window.addEventListener('scroll', markScrolling, { passive: true });
  window.addEventListener('resize', updateReadbar);

  /* ---------- 启动 ---------- */
  restorePrefs();
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
